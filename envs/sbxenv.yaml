schemaVersion: '1'

args:
  workspace:
    required: true
    description: Absolute path to the project to mount as the sandbox workspace
  doppler_project:
    required: true
    description: Doppler project holding the sandboxed agent's GitHub token
  doppler_config:
    required: true
    description: Doppler config (environment) within that project

workspace: ${{ env.args.workspace }}

secrets:
  github:
    command: doppler secrets get GH_TOKEN --plain -p ${{ env.args.doppler_project }} -c ${{ env.args.doppler_config }}
